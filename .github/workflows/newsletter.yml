name: AI newsletter

on:
  schedule:
    # Twice a day: 06:17 and 18:17 UTC
    - cron: "17 6,18 * * *"
  workflow_dispatch:
  push:
    paths:
      - "newsletter/**"
      - ".github/workflows/newsletter.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: newsletter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the AI SDKs
        run: pip install --quiet openai anthropic
      - name: Build newsletter
        env:
          # Optional. With one of these repository secrets set, an AI model writes the
          # summaries, ranks stories and merges duplicate coverage (OpenAI is used if both
          # are set). Without either, the page uses the publishers' own text.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: raise the rate limits on the vulnerability lookups.
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 newsletter/build.py --out _site/index.html
      - name: Build learning page
        run: python3 newsletter/learn.py --out _site/learn/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    # Only the default branch publishes; other branches just prove the build works.
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
